<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>心得 · 翻阅 + 备份</title>
    <style>
        /* 全局黑白极简，兼顾移动端 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f8f8;
            color: #111;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            padding: 1rem 0.8rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #d0d0d0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            padding: 1.2rem 1rem 1.5rem;
        }

        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem 0.8rem;
            border-bottom: 2px solid #222;
            padding-bottom: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: #000;
        }

        .header .today-badge {
            font-size: 0.85rem;
            color: #333;
            background: #f0f0f0;
            padding: 0.1rem 0.9rem;
            border-radius: 30px;
            border: 1px solid #ccc;
        }

        /* 双栏布局：移动端自动堆叠 */
        .main-layout {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        /* ===== 左侧：日历面板 ===== */
        .calendar-panel {
            flex: 0 0 250px;
            min-width: 200px;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            padding: 0 0.1rem;
        }

        .calendar-nav .month-year {
            font-size: 1.05rem;
            font-weight: 500;
            color: #000;
        }

        .calendar-nav .nav-btn {
            background: #f0f0f0;
            border: 1px solid #b0b0b0;
            border-radius: 30px;
            width: 34px;
            height: 34px;
            font-size: 1.2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            color: #111;
            user-select: none;
            touch-action: manipulation;
        }

        .calendar-nav .nav-btn:hover {
            background: #e0e0e0;
            border-color: #777;
        }
        .calendar-nav .nav-btn:active {
            background: #ccc;
        }

        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.7rem;
            font-weight: 500;
            color: #444;
            letter-spacing: 0.2px;
            margin-bottom: 0.2rem;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 0.2rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.82rem;
            border-radius: 4px;
            cursor: pointer;
            background: #fcfcfc;
            border: 1px solid transparent;
            transition: background 0.1s, border 0.1s;
            color: #222;
            font-weight: 400;
            position: relative;
            touch-action: manipulation;
        }

        .day-cell:hover {
            background: #eaeaea;
            border-color: #aaa;
        }

        .day-cell.other-month {
            color: #b0b0b0;
            background: #fafafa;
        }

        .day-cell.has-entry {
            font-weight: 600;
            background: #e8e8e8;
            border-color: #bbb;
        }

        .day-cell.has-entry:hover {
            background: #d6d6d6;
        }

        .day-cell.selected {
            background: #222 !important;
            color: #fff !important;
            border-color: #222;
            font-weight: 500;
        }

        .day-cell.selected.has-entry {
            background: #111 !important;
            color: #fff !important;
        }

        .day-cell.today {
            border: 1.5px solid #555;
        }

        .calendar-hint {
            margin-top: 0.6rem;
            font-size: 0.65rem;
            color: #5a5a5a;
            border-top: 1px solid #e0e0e0;
            padding-top: 0.5rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.2rem;
        }

        .calendar-hint .dot-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .dot-indicator .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #888;
            border-radius: 2px;
        }

        /* ===== 右侧：内容面板 ===== */
        .content-panel {
            flex: 1;
            min-width: 200px;
        }

        .entry-date-header {
            font-size: 1.1rem;
            font-weight: 500;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 0.2rem;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.2rem 0.6rem;
        }

        .entry-date-header .date-label {
            color: #000;
        }

        .entry-date-header .entry-count {
            font-size: 0.75rem;
            color: #555;
            font-weight: 400;
        }

        .entry-textarea {
            width: 100%;
            min-height: 180px;
            padding: 0.9rem 1rem;
            font-size: 0.98rem;
            font-family: 'Segoe UI', 'Roboto', 'Georgia', serif;
            line-height: 1.8;
            color: #111;
            background: #fcfcfc;
            border: 1px solid #b8b8b8;
            border-radius: 4px;
            resize: vertical;
            transition: border 0.15s, box-shadow 0.15s;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
            -webkit-appearance: none;
        }

        .entry-textarea:focus {
            outline: none;
            border-color: #222;
            background: #fff;
            box-shadow: 0 0 0 1px #222, inset 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        /* 操作栏 + 备份区整合 */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 0.8rem;
            margin-top: 0.7rem;
            padding-top: 0.6rem;
            border-top: 1px solid #d6d6d6;
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .btn {
            background: #f0f0f0;
            border: 1px solid #a0a0a0;
            padding: 0.35rem 1rem;
            font-size: 0.85rem;
            font-weight: 450;
            color: #111;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            background: #f7f7f7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            user-select: none;
            white-space: nowrap;
        }

        .btn:hover {
            background: #e6e6e6;
            border-color: #6e6e6e;
        }

        .btn:active {
            background: #d0d0d0;
            transform: scale(0.97);
        }

        .btn-primary {
            background: #111;
            border-color: #111;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2b2b2b;
            border-color: #2b2b2b;
            color: #fff;
        }

        .btn-outline {
            background: #fff;
            border-color: #999;
            color: #222;
        }

        .btn-outline:hover {
            background: #f0f0f0;
        }

        .btn-clear {
            background: #f0f0f0;
            border-color: #b0b0b0;
            color: #3a3a3a;
        }

        .btn-clear:hover {
            background: #e0e0e0;
            border-color: #888;
        }

        .stats {
            font-size: 0.75rem;
            color: #3f3f3f;
            background: #f2f2f2;
            padding: 0.1rem 0.9rem;
            border-radius: 30px;
            border: 1px solid #d0d0d0;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
        }

        .stats span {
            font-weight: 500;
            color: #000;
        }

        .save-feedback {
            font-size: 0.75rem;
            color: #1f1f1f;
            margin-top: 0.6rem;
            padding: 0.3rem 0.8rem;
            background: #f4f4f4;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.2rem;
        }

        .save-feedback .badge {
            background: #222;
            color: #fff;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            letter-spacing: 0.3px;
        }

        /* 备份专用区域 */
        .backup-section {
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid #d0d0d0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        .backup-section .backup-label {
            font-size: 0.8rem;
            color: #333;
            font-weight: 450;
        }

        .backup-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .backup-actions .btn {
            font-size: 0.8rem;
            padding: 0.3rem 1rem;
        }

        /* 隐藏的文件输入 */
        #fileInput {
            display: none;
        }

        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.65rem;
            color: #6f6f6f;
            border-top: 1px solid #ddd;
            padding-top: 1rem;
            text-align: center;
            width: 100%;
        }

        /* 响应式：移动端优化 */
        @media (max-width: 680px) {
            .container {
                padding: 0.8rem 0.6rem;
            }
            .main-layout {
                flex-direction: column;
                gap: 1rem;
            }
            .calendar-panel {
                flex: 1 1 auto;
                width: 100%;
            }
            .days-grid {
                gap: 3px;
            }
            .day-cell {
                font-size: 0.8rem;
            }
            .entry-textarea {
                min-height: 150px;
                font-size: 0.95rem;
                padding: 0.7rem 0.8rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .action-group {
                justify-content: center;
            }
            .stats {
                justify-content: center;
            }
            .backup-section {
                flex-direction: column;
                align-items: stretch;
                gap: 0.4rem;
            }
            .backup-actions {
                justify-content: center;
            }
            .btn {
                font-size: 0.8rem;
                padding: 0.3rem 0.9rem;
            }
        }

        @media (max-width: 420px) {
            .day-cell {
                font-size: 0.7rem;
            }
            .calendar-nav .month-year {
                font-size: 0.95rem;
            }
            .calendar-nav .nav-btn {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #aaa;
            border-radius: 12px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <header class="header">
        <h1>📖 心得 · 翻阅</h1>
        <span class="today-badge" id="todayDisplay">2026-08-18</span>
    </header>

    <!-- 主体 -->
    <div class="main-layout">
        <!-- 左侧日历 -->
        <aside class="calendar-panel">
            <div class="calendar-nav">
                <button class="nav-btn" id="prevMonthBtn">‹</button>
                <span class="month-year" id="monthYearDisplay">2026年8月</span>
                <button class="nav-btn" id="nextMonthBtn">›</button>
            </div>
            <div class="week-row">
                <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div class="days-grid" id="daysGrid"></div>
            <div class="calendar-hint">
                <span class="dot-indicator">
                    <span class="dot" style="background:#888;"></span> 有记录
                </span>
                <span>点击日期查阅</span>
            </div>
        </aside>

        <!-- 右侧内容 -->
        <section class="content-panel">
            <div class="entry-date-header">
                <span class="date-label" id="selectedDateLabel">2026-08-18</span>
                <span class="entry-count" id="entryCountLabel">0 字</span>
            </div>
            <textarea class="entry-textarea" id="diaryEntry" placeholder="写写今天的心得体会…"></textarea>

            <div class="action-bar">
                <div class="action-group">
                    <button class="btn btn-primary" id="saveBtn">⟳ 保存</button>
                    <button class="btn btn-clear" id="clearBtn">✕ 清空</button>
                </div>
                <div class="stats">
                    <span id="charCount">0</span> 字
                </div>
            </div>

            <div class="save-feedback" id="saveFeedback">
                <span>
                    <span class="badge">⏺</span> <span id="statusMessage">就绪</span>
                </span>
                <span id="lastSavedTime">—</span>
            </div>

            <!-- 备份/恢复区域 -->
            <div class="backup-section">
                <span class="backup-label">📦 备份与恢复</span>
                <div class="backup-actions">
                    <button class="btn btn-outline" id="exportBtn">⬇ 导出备份</button>
                    <button class="btn btn-outline" id="importBtn">⬆ 导入备份</button>
                    <input type="file" id="fileInput" accept=".json">
                </div>
            </div>
        </section>
    </div>

    <div class="footer-note">
        黑白 · 本地存储 · 按日期翻阅 · 支持备份/恢复 (JSON)
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ---------- DOM ----------
        const textarea = document.getElementById('diaryEntry');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const charCountSpan = document.getElementById('charCount');
        const statusMsg = document.getElementById('statusMessage');
        const lastSavedTimeSpan = document.getElementById('lastSavedTime');
        const todayDisplay = document.getElementById('todayDisplay');
        const selectedDateLabel = document.getElementById('selectedDateLabel');
        const entryCountLabel = document.getElementById('entryCountLabel');

        const daysGrid = document.getElementById('daysGrid');
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');

        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const fileInput = document.getElementById('fileInput');

        // ---------- 存储 KEY ----------
        const STORAGE_PREFIX = 'diary_';
        const SAVED_TIME_KEY = 'diary_last_saved_time';

        // ---------- 状态 ----------
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let selectedDate = new Date();

        function getDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function getEntry(date) {
            const key = STORAGE_PREFIX + getDateKey(date);
            return localStorage.getItem(key) || '';
        }

        function setEntry(date, content) {
            const key = STORAGE_PREFIX + getDateKey(date);
            if (content.trim() === '') {
                localStorage.removeItem(key);
            } else {
                localStorage.setItem(key, content);
            }
            localStorage.setItem(SAVED_TIME_KEY, new Date().toISOString());
        }

        function hasEntry(date) {
            const key = STORAGE_PREFIX + getDateKey(date);
            const val = localStorage.getItem(key);
            return val !== null && val.trim() !== '';
        }

        function getAllEntryDates() {
            const dates = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(STORAGE_PREFIX)) {
                    const dateStr = key.substring(STORAGE_PREFIX.length);
                    if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                        dates.push(dateStr);
                    }
                }
            }
            return dates;
        }

        // ---------- 渲染日历 ----------
        function renderCalendar(year, month) {
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            let firstDayWeek = firstDay.getDay();
            let startOffset = (firstDayWeek === 0) ? 6 : firstDayWeek - 1;

            const today = new Date();
            const todayStr = getDateKey(today);
            const allEntryDates = getAllEntryDates();
            const entrySet = new Set(allEntryDates);

            let html = '';
            const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

            // 上月
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = 0; i < startOffset; i++) {
                const day = prevMonthLastDay - startOffset + i + 1;
                const d = new Date(year, month - 1, day);
                const dateStr = getDateKey(d);
                const isEntry = entrySet.has(dateStr);
                html += `<div class="day-cell other-month${isEntry ? ' has-entry' : ''}" data-date="${dateStr}">${day}</div>`;
            }

            // 当月
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const dateStr = getDateKey(dateObj);
                const isEntry = entrySet.has(dateStr);
                const isToday = (dateStr === todayStr);
                const isSelected = (dateStr === getDateKey(selectedDate));

                let classes = 'day-cell';
                if (isEntry) classes += ' has-entry';
                if (isToday) classes += ' today';
                if (isSelected) classes += ' selected';
                html += `<div class="${classes}" data-date="${dateStr}">${d}</div>`;
            }

            // 下月
            const remaining = totalCells - (startOffset + daysInMonth);
            for (let d = 1; d <= remaining; d++) {
                const dateObj = new Date(year, month + 1, d);
                const dateStr = getDateKey(dateObj);
                const isEntry = entrySet.has(dateStr);
                html += `<div class="day-cell other-month${isEntry ? ' has-entry' : ''}" data-date="${dateStr}">${d}</div>`;
            }

            daysGrid.innerHTML = html;
            monthYearDisplay.textContent = year + '年' + (month + 1) + '月';

            document.querySelectorAll('.day-cell').forEach(cell => {
                cell.addEventListener('click', function() {
                    const dateStr = this.dataset.date;
                    if (!dateStr) return;
                    const parts = dateStr.split('-');
                    const y = parseInt(parts[0]);
                    const m = parseInt(parts[1]) - 1;
                    const d = parseInt(parts[2]);
                    const newDate = new Date(y, m, d);
                    selectedDate = newDate;
                    loadEntryForDate(newDate);
                    renderCalendar(currentYear, currentMonth);
                });
            });
        }

        // ---------- 加载某天内容 ----------
        function loadEntryForDate(date) {
            const content = getEntry(date);
            textarea.value = content;
            const dateStr = getDateKey(date);
            selectedDateLabel.textContent = dateStr;
            updateWordCount();
            updateLastSavedDisplay();
            const count = content.trim().length;
            entryCountLabel.textContent = count + ' 字';
            statusMsg.textContent = '已加载';
        }

        function updateWordCount() {
            const raw = textarea.value;
            const count = raw.trim().length;
            charCountSpan.textContent = count;
            return count;
        }

        // ---------- 保存当前 ----------
        function saveCurrentEntry() {
            const content = textarea.value;
            setEntry(selectedDate, content);
            const nowISO = new Date().toISOString();
            localStorage.setItem(SAVED_TIME_KEY, nowISO);
            statusMsg.textContent = '✓ 已保存';
            updateLastSavedDisplay();
            updateWordCount();
            const count = content.trim().length;
            entryCountLabel.textContent = count + ' 字';
            renderCalendar(currentYear, currentMonth);
            clearTimeout(window._saveStatusTimer);
            window._saveStatusTimer = setTimeout(() => {
                statusMsg.textContent = '就绪';
            }, 2500);
        }

        function clearCurrentEntry() {
            const dateStr = getDateKey(selectedDate);
            if (textarea.value.trim() === '') {
                statusMsg.textContent = '已是空白';
                return;
            }
            if (window.confirm('确定清空 ' + dateStr + ' 的记录吗？')) {
                localStorage.removeItem(STORAGE_PREFIX + dateStr);
                textarea.value = '';
                updateWordCount();
                entryCountLabel.textContent = '0 字';
                statusMsg.textContent = '已清空';
                lastSavedTimeSpan.textContent = '—';
                renderCalendar(currentYear, currentMonth);
            }
        }

        function updateLastSavedDisplay() {
            const savedTime = localStorage.getItem(SAVED_TIME_KEY);
            if (savedTime) {
                try {
                    const date = new Date(savedTime);
                    const timeStr = date.toLocaleString('zh-CN', {
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    lastSavedTimeSpan.textContent = '上次保存: ' + timeStr;
                } catch (e) {
                    lastSavedTimeSpan.textContent = '上次保存: 时间未知';
                }
            } else {
                lastSavedTimeSpan.textContent = '—';
            }
        }

        // ---------- 备份 (导出) ----------
        function exportBackup() {
            const allData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(STORAGE_PREFIX)) {
                    allData[key] = localStorage.getItem(key);
                }
            }
            // 额外保存全局时间
            const globalTime = localStorage.getItem(SAVED_TIME_KEY);
            if (globalTime) {
                allData['_global_time'] = globalTime;
            }
            const json = JSON.stringify(allData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const dateStr = getDateKey(new Date());
            a.download = `diary_backup_${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            statusMsg.textContent = '⬇ 备份已导出';
            setTimeout(() => { statusMsg.textContent = '就绪'; }, 2000);
        }

        // ---------- 恢复 (导入) ----------
        function importBackup(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    let count = 0;
                    for (const key in data) {
                        if (key.startsWith(STORAGE_PREFIX)) {
                            localStorage.setItem(key, data[key]);
                            count++;
                        } else if (key === '_global_time') {
                            localStorage.setItem(SAVED_TIME_KEY, data[key]);
                        }
                    }
                    statusMsg.textContent = `⬆ 导入成功 (${count} 条记录)`;
                    // 刷新日历 & 当前内容
                    renderCalendar(currentYear, currentMonth);
                    loadEntryForDate(selectedDate);
                    updateLastSavedDisplay();
                    setTimeout(() => { statusMsg.textContent = '就绪'; }, 3000);
                } catch (err) {
                    statusMsg.textContent = '❌ 导入失败，文件格式错误';
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        // ---------- 初始化 ----------
        function init() {
            const today = new Date();
            todayDisplay.textContent = getDateKey(today);
            selectedDate = new Date(today);
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();

            loadEntryForDate(selectedDate);
            renderCalendar(currentYear, currentMonth);

            // 事件
            saveBtn.addEventListener('click', function(e) {
                e.preventDefault();
                saveCurrentEntry();
            });

            clearBtn.addEventListener('click', function(e) {
                e.preventDefault();
                clearCurrentEntry();
            });

            textarea.addEventListener('input', function() {
                updateWordCount();
                clearTimeout(window._autoSaveTimer);
                window._autoSaveTimer = setTimeout(() => {
                    const current = textarea.value;
                    const stored = getEntry(selectedDate);
                    if (current !== stored) {
                        saveCurrentEntry();
                        statusMsg.textContent = '⟳ 自动保存';
                        setTimeout(() => { statusMsg.textContent = '就绪'; }, 1800);
                    }
                }, 600);
            });

            textarea.addEventListener('blur', function() {
                const current = textarea.value;
                const stored = getEntry(selectedDate);
                if (current !== stored) {
                    saveCurrentEntry();
                    statusMsg.textContent = '↻ 已保存';
                    setTimeout(() => { statusMsg.textContent = '就绪'; }, 1500);
                }
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveCurrentEntry();
                    statusMsg.textContent = '⌘ 已保存';
                    setTimeout(() => { statusMsg.textContent = '就绪'; }, 1500);
                }
            });

            prevMonthBtn.addEventListener('click', function() {
                if (currentMonth === 0) {
                    currentMonth = 11;
                    currentYear--;
                } else {
                    currentMonth--;
                }
                renderCalendar(currentYear, currentMonth);
            });

            nextMonthBtn.addEventListener('click', function() {
                if (currentMonth === 11) {
                    currentMonth = 0;
                    currentYear++;
                } else {
                    currentMonth++;
                }
                renderCalendar(currentYear, currentMonth);
            });

            // 备份导出
            exportBtn.addEventListener('click', function(e) {
                e.preventDefault();
                exportBackup();
            });

            // 导入触发文件选择
            importBtn.addEventListener('click', function(e) {
                e.preventDefault();
                fileInput.click();
            });

            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    importBackup(this.files[0]);
                    this.value = ''; // 重置以便重复选择同一文件
                }
            });

            window.addEventListener('beforeunload', function() {
                const current = textarea.value;
                const stored = getEntry(selectedDate);
                if (current !== stored) {
                    setEntry(selectedDate, current);
                }
            });
        }

        init();
    })();
</script>
</body>
</html>
